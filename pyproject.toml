[project]
name = "qiankun"
version = "0.1.0"
description = "Cron task scheduling service with provider plugins, CDP browser capability and SSE execution logs"
requires-python = ">=3.12"
keywords = ["fastapi", "scheduler", "cron", "task", "postgresql"]
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "croniter>=6.0.0",
    "curl-cffi>=0.13.0",
    "fastapi>=0.142.2",
    "loguru>=0.7.3",
    "playwright>=1.55.0",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0",
    "PyJWT[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3,<3",
    "uvicorn[standard]>=0.54.0",
    "asyncpg>=0.31.0",
    "types-croniter>=6.2.4.20261006",
    "packaging>=26.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.19.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.0,<1"]
build-backend = "uv_build"

[tool.uv]
package = false
