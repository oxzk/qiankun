<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>QianKun Bagua Logo</title>
  <defs>
    <!-- Dark Slate/Black App Icon Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="90" y1="90" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background App-Icon Rect (Black/Deep Slate Rounded Square) -->
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Tech Radar Rings (Subtle Backplate) -->
  <circle cx="128" cy="128" r="118" stroke="#334155" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Swirling Yin-Yang Center (Taiji - Corrected circular path coordinates) -->
  <g filter="url(#neonGlow)">
    <!-- Cyan Swirl (Yang) -->
    <path d="M 128 72 A 28 28 0 0 0 128 128 A 28 28 0 0 1 128 184 A 56 56 0 0 1 128 72 Z" fill="url(#cyanGrad)"/>
    <!-- White Swirl (Yin) -->
    <path d="M 128 184 A 28 28 0 0 0 128 128 A 28 28 0 0 1 128 72 A 56 56 0 0 1 128 184 Z" fill="#FFFFFF"/>
    <!-- Swirl Dots -->
    <circle cx="128" cy="100" r="6.5" fill="#FFFFFF"/>
    <circle cx="128" cy="156" r="6.5" fill="url(#cyanGrad)"/>
    <!-- Gold Separation Ring -->
    <path d="M 128 72 A 28 28 0 0 0 128 128 A 28 28 0 0 1 128 184 A 56 56 0 0 1 128 72" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.2"/>
  </g>

  <!-- 8 Trigrams (Earlier Heaven Bagua - 先天八卦) -->
  <!-- Stroke style: White, stroke-width=4, round caps -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    
    <!-- 1. Top (0°): 乾 Qian (☰ - Heaven) -->
    <g transform="translate(128, 128) rotate(0) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 2. Top-Right (45°): 巽 Xun (☴ - Wind) -->
    <g transform="translate(128, 128) rotate(45) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="-2.5" y2="5.5" /><line x1="2.5" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 3. Right (90°): 坎 Kan (☵ - Water) -->
    <g transform="translate(128, 128) rotate(90) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="-2.5" y2="-5.5" /><line x1="2.5" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="-2.5" y2="5.5" /><line x1="2.5" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 4. Bottom-Right (135°): 艮 Gen (☶ - Mountain) -->
    <g transform="translate(128, 128) rotate(135) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="-2.5" y2="0" /><line x1="2.5" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="-2.5" y2="5.5" /><line x1="2.5" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 5. Bottom (180°): 坤 Kun (☷ - Earth) -->
    <g transform="translate(128, 128) rotate(180) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="-2.5" y2="-5.5" /><line x1="2.5" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="-2.5" y2="0" /><line x1="2.5" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="-2.5" y2="5.5" /><line x1="2.5" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 6. Bottom-Left (225°): 震 Zhen (☳ - Thunder) -->
    <g transform="translate(128, 128) rotate(225) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="-2.5" y2="-5.5" /><line x1="2.5" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="-2.5" y2="0" /><line x1="2.5" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 7. Left (270°): 离 Li (☲ - Fire) -->
    <g transform="translate(128, 128) rotate(270) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="-2.5" y2="0" /><line x1="2.5" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="12" y2="5.5" />
    </g>

    <!-- 8. Top-Left (315°): 兑 Dui (☱ - Lake) -->
    <g transform="translate(128, 128) rotate(315) translate(0, -90)">
      <line x1="-12" y1="-5.5" x2="-2.5" y2="-5.5" /><line x1="2.5" y1="-5.5" x2="12" y2="-5.5" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-12" y1="5.5" x2="12" y2="5.5" />
    </g>

  </g>

  <!-- Constellation Dots -->
  <circle cx="236" cy="128" r="6" fill="#3B82F6" opacity="0.8"/>
  <circle cx="20" cy="128" r="6" fill="#FFFFFF" opacity="0.8"/>
</svg>
